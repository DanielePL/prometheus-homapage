services:
  - type: web
    runtime: static
    name: prometheus-coach
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /.well-known/apple-app-site-association
        name: Content-Type
        value: application/json
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
